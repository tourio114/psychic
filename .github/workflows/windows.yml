name: Build Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish portable application
        run: dotnet publish src/PsychicIsland/PsychicIsland.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publish
      - name: Smoke test on Windows
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: ./scripts/Smoke-Test.ps1 -Exe ./publish/PsychicIsland.exe
      - name: Save desktop screenshot
        if: always() && matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-smoke-screenshot
          path: smoke-screenshot.png
          if-no-files-found: ignore
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md publish/README.md
          Compress-Archive -Path publish/* -DestinationPath PsychicIsland-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PsychicIsland-${{ matrix.rid }}
          path: PsychicIsland-${{ matrix.rid }}.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PsychicIsland-*
          merge-multiple: true
          path: artifacts
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.zip --repo "$GITHUB_REPOSITORY" --title "Psychic Island $GITHUB_REF_NAME" --generate-notes
